name: Atualizar telemetria

on:
  schedule:
    # Todos os dias às 09:17 UTC (06:17 em São Paulo).
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_telemetry.py
      - .github/workflows/telemetry.yml

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar snapshot público
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_telemetry.py

      - name: Validar SVG
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('assets/telemetry.svg')"

      # Apenas o workflow, quando publicado, salva o SVG no GitHub.
      - name: Salvar telemetria atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update telemetry snapshot"
            git push
          fi
